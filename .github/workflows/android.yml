name: Build APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
      # The Kotlin compile daemon is the usual suspect when a CI build hangs
      # with no output; run the compiler inside the Gradle process instead.
      ORG_GRADLE_PROJECT_kotlin.compiler.execution.strategy: "in-process"
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        timeout-minutes: 20
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        timeout-minutes: 20
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/DepthMaker-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../out/DepthMaker-release.apk
          ls -la ../out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DepthMaker-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release with APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "DepthMaker APK build ${{ github.run_number }}" \
            --notes "Automated build from ${{ github.ref_name }} (${{ github.sha }}).

          - \`DepthMaker-debug.apk\` — debug-signed, installable by sideload.
          - \`DepthMaker-release.apk\` — release build (debug-signed unless release keystore secrets are configured).

          Set the backend Server URL and bearer token in the app's Settings screen before first use."
